<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#fff"/><g fill="#000" font-family="Georgia,serif"><text x="120" y="65" font-size="28">Moneybee</text><text x="620" y="190" font-size="66">PMS vs AIF:</text><text x="620" y="260" font-size="66">Understanding the Difference</text></g><g fill="none" stroke="#000" stroke-width="2"><circle cx="420" cy="525" r="200"/><circle cx="1020" cy="525" r="200"/></g><path d="M720 325V725" stroke="#9D9EA1"/><rect x="704" y="510" width="32" height="30" fill="#fff"/><text x="720" y="530" text-anchor="middle" font-family="monospace" font-size="14">vs</text><g text-anchor="middle" font-family="Georgia,serif" font-size="82"><text x="420" y="465">PMS</text><text x="1020" y="465">AIF</text></g><circle cx="1020" cy="563" r="66" fill="none" stroke="#000" stroke-width="1.5"/><g fill="#F6A11A"><circle cx="380" cy="545" r="9"/><circle cx="420" cy="545" r="9"/><circle cx="460" cy="545" r="9"/><circle cx="380" cy="580" r="9"/><circle cx="420" cy="580" r="9"/><circle cx="460" cy="580" r="9"/><circle cx="980" cy="545" r="9"/><circle cx="1020" cy="545" r="9"/><circle cx="1060" cy="545" r="9"/><circle cx="980" cy="580" r="9"/><circle cx="1020" cy="580" r="9"/><circle cx="1060" cy="580" r="9"/></g><g text-anchor="middle" font-family="Arial,sans-serif" font-size="19"><text x="420" y="652">Investor directly</text><text x="420" y="678">holds securities</text><text x="1020" y="652">Investor receives</text><text x="1020" y="678">units of the fund</text></g><g font-family="Arial,sans-serif" font-size="20"><text x="120" y="799">In a PMS you own the stocks in your own demat account.</text><text x="120" y="829">In an AIF you own units of the fund.</text></g></svg>