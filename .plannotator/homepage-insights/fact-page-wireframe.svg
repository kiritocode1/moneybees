<text x="48" y="70" font-size="22" font-weight="700">MONEYBEE</text><text x="1180" y="70" font-size="15">PMS    AIF    Contact Us</text>
<!-- 1. pinned figure + fact -->
<text x="48" y="190" font-size="10" fill="#0009" letter-spacing="2">001 · WEALTH SINCE 2007</text>
<text x="48" y="290" font-size="92" font-weight="300" letter-spacing="-4">₹10 lakh became</text>
<text x="48" y="385" font-size="92" font-weight="300" letter-spacing="-4">₹2.885 crore</text>
<text x="48" y="440" font-size="13" fill="#000a">Queenbee PMS, 1 August 2007 to 31 July 2026. The S&amp;P BSE 500 TRI turned the same amount into ₹59.7 lakh.</text>
<rect x="760" y="480" width="632" height="560" fill="#000"/>
<text x="1076" y="770" font-size="15" fill="#fff" text-anchor="middle">The card figure at full size, scroll-driven:</text>
<text x="1076" y="795" font-size="15" fill="#fff" text-anchor="middle">plates stack year by year as you scroll</text>
<text x="1076" y="830" font-size="12" fill="#F7A11A" text-anchor="middle">pinned for ~2 viewports, same linework as the card</text>
<!-- scroll steps -->
<line x1="48" y1="520" x2="700" y2="520" stroke="#0002"/>
<text x="48" y="560" font-size="11" fill="#0008">2007</text><text x="120" y="560" font-size="26" font-weight="300">₹10 lakh, both portfolios</text>
<line x1="48" y1="620" x2="700" y2="620" stroke="#0002"/>
<text x="48" y="660" font-size="11" fill="#0008">19.44%</text><text x="120" y="660" font-size="26" font-weight="300">a year for Queenbee, 9.90% for the index</text>
<line x1="48" y1="720" x2="700" y2="720" stroke="#0002"/>
<text x="48" y="760" font-size="11" fill="#0008">2026</text><text x="120" y="760" font-size="26" font-weight="300">₹2.885 crore against ₹59.7 lakh, 4.83×</text>
<line x1="48" y1="820" x2="700" y2="820" stroke="#0002"/>
<!-- 2. the data table -->
<rect x="0" y="1100" width="1440" height="420" fill="#9D9EA1"/>
<text x="48" y="1160" font-size="10" letter-spacing="2" fill="#0009">THE FULL TABLE</text>
<g font-size="13">
<text x="48" y="1210">Period</text><text x="420" y="1210">Queenbee</text><text x="620" y="1210">S&amp;P BSE 500 TRI</text><text x="860" y="1210">Difference</text>
<text x="48" y="1250">1 year</text><text x="420" y="1250">−7.45%</text><text x="620" y="1250">1.95%</text><text x="860" y="1250">−9.40 pp</text>
<text x="48" y="1290">5 years</text><text x="420" y="1290">19.79%</text><text x="620" y="1290">11.01%</text><text x="860" y="1290">+8.78 pp</text>
<text x="48" y="1330">Since inception</text><text x="420" y="1330">19.44%</text><text x="620" y="1330">9.90%</text><text x="860" y="1330">+9.54 pp</text>
</g>
<text x="48" y="1400" font-size="11" fill="#000a">Every row from the source table is shown, including the weak year.</text>
<!-- 3. method + source -->
<text x="48" y="1600" font-size="10" letter-spacing="2" fill="#0009">HOW THIS WAS MEASURED</text>
<text x="48" y="1640" font-size="13" fill="#000b">TWRR, after expenses, adjusted for inflows and outflows. APMI data. Individual portfolios differ. Not verified by SEBI.</text>
